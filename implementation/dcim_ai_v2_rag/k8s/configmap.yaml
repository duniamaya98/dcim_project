apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: dcim-analytics
data:
  # API Configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DEBUG: "false"

  # Database
  TIMESCALEDB_HOST: "10.70.0.56"
  TIMESCALEDB_PORT: "5433"
  TIMESCALEDB_DATABASE: "dcim_analytics"
  TIMESCALEDB_USER: "ai_team"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "10.70.0.56:9092"
  KAFKA_CONSUMER_GROUP: "ai-team-consumer"

  # Topics
  KAFKA_TOPIC_METRICS: "dcim.analytics.metrics"
  KAFKA_TOPIC_ENRICHED: "dcim.enriched.events"
  KAFKA_TOPIC_ANOMALIES: "dcim.analytics.anomalies"
  KAFKA_TOPIC_PREDICTIONS: "dcim.analytics.predictions"
  KAFKA_TOPIC_RCA: "dcim.analytics.rca"
  KAFKA_TOPIC_CAPACITY: "dcim.analytics.capacity"
  KAFKA_TOPIC_ENERGY: "dcim.analytics.energy"
  KAFKA_TOPIC_DLQ: "dcim.analytics.dlq"

  # Redis (if available)
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "3"

  # Model Registry
  MODEL_REGISTRY_PATH: "/opt/dcim/models"

  # Authentication
  AUTH_ENABLED: "true"

  # Performance Limits
  MAX_PAGE_SIZE: "100"
  DEFAULT_PAGE_SIZE: "25"

  # Anomaly Detection
  ANOMALY_ZSCORE_THRESHOLD: "3.0"
  ANOMALY_WINDOW_SIZE: "100"

  # RCA
  RCA_TIMEOUT_SECONDS: "30"
  RCA_TOPOLOGY_DEPTH: "3"

  # LLM/RAG
  LLM_BACKEND: "local"
  LLM_MODEL: "qwen2.5-3b-instruct"
  LLM_TIMEOUT_SECONDS: "10"
