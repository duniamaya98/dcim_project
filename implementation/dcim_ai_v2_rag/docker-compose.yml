services:
  # ============================================================================
  # FastAPI Application Server
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dcim-analytics-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_DATABASE=dcim_analytics
      - TIMESCALEDB_USER=ai_team
      - TIMESCALEDB_PASSWORD=${TIMESCALEDB_PASSWORD:?Set TIMESCALEDB_PASSWORD in .env}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_ENABLED=false
    depends_on:
      - timescaledb
      - kafka
      - redis
    volumes:
      - ./api:/app/api
      - ./registry:/app/registry
      - ./root_cause:/app/root_cause
      - ./models:/opt/dcim/models
    networks:
      - dcim-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Metrics Ingestion Consumer
  # ============================================================================
  metrics-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: dcim-metrics-consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_METRICS=dcim.analytics.metrics
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_DATABASE=dcim_analytics
      - TIMESCALEDB_USER=ai_team
      - TIMESCALEDB_PASSWORD=${TIMESCALEDB_PASSWORD:?Set TIMESCALEDB_PASSWORD in .env}
    depends_on:
      - timescaledb
      - kafka
    volumes:
      - ./stream:/app/stream
    networks:
      - dcim-network
    restart: unless-stopped
    command: ["python", "-m", "stream.metrics_consumer"]

  # ============================================================================
  # Anomaly Detection Processor
  # ============================================================================
  anomaly-detector:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: dcim-anomaly-detector
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_ANOMALIES=dcim.analytics.anomalies
      - TIMESCALEDB_HOST=timescaledb
      - TIMESCALEDB_PORT=5432
      - TIMESCALEDB_DATABASE=dcim_analytics
      - TIMESCALEDB_USER=ai_team
      - TIMESCALEDB_PASSWORD=${TIMESCALEDB_PASSWORD:?Set TIMESCALEDB_PASSWORD in .env}
      - ANOMALY_ZSCORE_THRESHOLD=3.0
      - ANOMALY_WINDOW_SIZE=100
    depends_on:
      - timescaledb
      - kafka
      - metrics-consumer
    volumes:
      - ./stream:/app/stream
    networks:
      - dcim-network
    restart: unless-stopped
    command: ["python", "-m", "stream.anomaly_detector"]

  # ============================================================================
  # TimescaleDB (PostgreSQL with TimescaleDB extension)
  # ============================================================================
  timescaledb:
    image: timescale/timescaledb:2.15.0-pg16
    container_name: dcim-timescaledb
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=dcim_analytics
      - POSTGRES_USER=ai_team
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD:?Set TIMESCALEDB_PASSWORD in .env}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - dcim-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_team -d dcim_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis (Caching layer)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: dcim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dcim-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Kafka (Message broker)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dcim-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dcim-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Kafka UI (Optional - for development)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dcim-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - dcim-network
    restart: unless-stopped

networks:
  dcim-network:
    driver: bridge

volumes:
  timescaledb-data:
  redis-data:
  kafka-data:
